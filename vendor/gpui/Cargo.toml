# gpui, vendored at the revision Cargo.lock pins. See UPSTREAM.md for where
# this came from and every change made here. This is a workspace of its own
# so the crate's `workspace = true` references resolve: the dependency table
# and the lints are zed's, with its sibling crates taken from the zed git
# source in place of their paths. Emaki's root Cargo.toml excludes `vendor`
# and patches the git source with this path.
[workspace]
resolver = "2"
members = ["crates/gpui"]

[workspace.package]
publish = false
edition = "2024"

[workspace.dependencies]

