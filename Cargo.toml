[workspace]
resolver = "2"
members = ["crates/emaki-core", "crates/emaki-app"]

[workspace.package]
version = "0.1.1"
edition = "2021"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
rusqlite = { version = "0.32", features = ["bundled"] }
dirs = "5"
notify = "7"
chrono = { version = "0.4", features = ["serde"] }
sha1_smol = "1"
regex = "1"
unicode-normalization = "0.1"

[profile.dev]
# gpui's dependency tree is huge; a little optimisation keeps the UI usable in dev.
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

[profile.release]
strip = true
lto = "thin"
