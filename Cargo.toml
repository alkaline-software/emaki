[workspace]
resolver = "2"
members = ["crates/emaki-core", "crates/emaki-app"]
# The vendored toolkit is a workspace of its own; see vendor/gpui-component/UPSTREAM.md.
exclude = ["vendor"]

[workspace.package]
version = "0.3.1"
edition = "2021"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
rusqlite = { version = "0.32", features = ["bundled"] }
dirs = "5"
notify = "7"
chrono = { version = "0.4", features = ["serde"] }
sha1_smol = "1"
regex = "1"
unicode-normalization = "0.1"

[profile.dev]
# gpui's dependency tree is huge; a little optimization keeps the UI usable in dev.
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

# Air, and the Biome crates it formats with, check their own work at every
# step while debug assertions are on: a 6,700-line R file took half a
# second to format in the dev build and 25 ms in a release one. The dev
# build is the one worked in, so these are built as a release has them.
[profile.dev.package.air_r_formatter]
opt-level = 3
debug-assertions = false

[profile.dev.package.air_r_parser]
opt-level = 3
debug-assertions = false

[profile.dev.package.air_r_syntax]
opt-level = 3
debug-assertions = false

[profile.dev.package.air_r_factory]
opt-level = 3
debug-assertions = false

[profile.dev.package.biome_formatter]
opt-level = 3
debug-assertions = false

[profile.dev.package.biome_rowan]
opt-level = 3
debug-assertions = false

[profile.dev.package.biome_parser]
opt-level = 3
debug-assertions = false

[profile.dev.package.biome_text_size]
opt-level = 3
debug-assertions = false

[profile.dev.package.biome_unicode_table]
opt-level = 3
debug-assertions = false

[profile.release]
strip = true
lto = "thin"

# The toolkit is vendored: the same crates, from the same revision the git
# dependencies name, built from vendor/ so they can be changed here. See
# vendor/gpui-component/UPSTREAM.md.
[patch."https://github.com/longbridge/gpui-component"]
gpui-component = { path = "vendor/gpui-component/crates/ui" }
gpui-base = { path = "vendor/gpui-component/crates/base" }
gpui-component-macros = { path = "vendor/gpui-component/crates/macros" }
gpui-component-assets = { path = "vendor/gpui-component/crates/assets" }

# Stylo's derive, with one line changed so it builds beside gpui
# (`vendor/stylo_derive/UPSTREAM.md`). Blitz, which draws an HTML file,
# is built on Stylo.
[patch.crates-io]
stylo_derive = { path = "vendor/stylo_derive" }
# Two crates at the end of their line, each changed in a line or two so a future Rust still compiles them without a word (`vendor/block/UPSTREAM.md`, `vendor/proc-macro-error2/UPSTREAM.md`): the Objective-C blocks crate cocoa pulls in under gpui's Mac backend, and the proc-macro helper biome's derives pull in under Air.
block = { path = "vendor/block" }
proc-macro-error2 = { path = "vendor/proc-macro-error2" }
