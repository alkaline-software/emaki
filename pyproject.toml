[project]
name = "emaki"
version = "0.1.0"
description = "A readable, regenerable copy of every Claude Code session."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = []

[project.scripts]
emaki = "emaki.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Only the package. The viewer lives at emaki/viewer/ so it ships as package
# data rather than as a top-level `viewer/` in site-packages, and the CLI is
# reached through the console script above rather than by shipping bin/.
packages = ["emaki"]

[tool.hatch.build.targets.sdist]
include = ["emaki", "bin", "tests", "README.md", "AGENTS.md", "LICENSE", "pyproject.toml"]
