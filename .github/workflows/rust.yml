name: rust

# The native app and its core, on every OS the app ships for. Tests and a
# build on every push and pull request; installers are release.yml's job and
# only run on a tag, because a GPUI build is slow.
on:
  push:
    branches: [main, gpui-app]
    paths-ignore: ["docs/**", "scribe/**", "bin/**", "tests/**", "*.md"]
  pull_request:
    paths-ignore: ["docs/**", "scribe/**", "bin/**", "tests/**", "*.md"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      # Everything gpui links against on Linux. The list is zed's own
      # (script/linux), minus the audio and the editor-only parts.
      - name: Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang cmake pkg-config libssl-dev libzstd-dev \
            libfontconfig-dev libfreetype-dev libwayland-dev libx11-xcb-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libxcb1-dev \
            libvulkan-dev libvulkan1 mesa-vulkan-drivers libasound2-dev

      - uses: Swatinem/rust-cache@v2
        with:
          # One cache per OS, shared across branches so a PR starts warm.
          shared-key: rust-${{ matrix.os }}

      - name: Tests
        run: cargo test -p scribe-core --locked
        env:
          # Never let a CI run touch a real ~/.scribe or ~/.claude.
          SCRIBE_HOME: ${{ runner.temp }}/scribe-home
          CLAUDE_CONFIG_DIR: ${{ runner.temp }}/claude
          CODEX_HOME: ${{ runner.temp }}/codex

      - name: Build the app
        run: cargo build -p scribe-app -p scribe-core --locked

      - name: The CLI runs
        run: cargo run -p scribe-core --locked -- list
        env:
          SCRIBE_HOME: ${{ runner.temp }}/scribe-home
          CLAUDE_CONFIG_DIR: ${{ runner.temp }}/claude
          CODEX_HOME: ${{ runner.temp }}/codex
