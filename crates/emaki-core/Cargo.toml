[package]
name = "emaki-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
rusqlite.workspace = true
dirs.workspace = true
notify.workspace = true
chrono.workspace = true
sha1_smol.workspace = true
regex.workspace = true
unicode-normalization.workspace = true
# The update check and the installer download: one small HTTPS client on
# rustls, which the tree already carries.
ureq = { version = "2", default-features = false, features = ["tls"] }
vt100 = "0.16"
portable-pty = "0.9"
# English grammar and spelling for the composer, offline and in process.
harper-core = { version = "2.11", default-features = false, features = ["concurrent"] }

# Which lines of a file differ from what git has, for the marks beside
# the file's editor. Already in the tree by way of other crates.
similar = "2"
# A downloaded model checked against the hash it is published with.
sha2 = "0.10"

# Air, Posit's formatter for R, in the process: an R file saved from the
# file's pane is formatted as Air's own extension formats one on save.
# Not on crates.io; the revision is the pin. The parser is the copy in
# vendor/air_r_parser, built on the tree-sitter the window already has.
air_r_parser = { path = "../../vendor/air_r_parser" }
air_r_formatter = { git = "https://github.com/posit-dev/air", rev = "8d20826ccf65a0ccc1d6a82e78d308213271667c" }

# dprint's formatters, in the process as Air is: TypeScript and
# JavaScript, JSON, Markdown and TOML. Each is a library as well as a
# plugin of dprint's, so nothing is downloaded or run.
dprint-core = "0.70"
dprint-plugin-typescript = "0.96"
dprint-plugin-json = "0.25"
dprint-plugin-markdown = "0.26"
dprint-plugin-toml = "0.9"

# Office files for the file's pane, read only. A workbook is calamine's;
# a document and a deck are zips of XML read here. zip and quick-xml are
# the versions calamine itself builds on, zip with deflate alone.
calamine = "0.36"
zip = { version = "8", default-features = false, features = ["deflate-flate2-zlib-rs"] }
quick-xml = "0.41"
# A workbook's cells as the sheet shows them: 50% and not 0.5, a date
# and not its serial. GridCraft's reader and number formats
# (storytold/gridcraft, MIT OR Apache-2.0), pure Rust; not on crates.io,
# so pinned to a commit. calamine still reads what this does not.
gridcraft-core = { git = "https://github.com/storytold/gridcraft", rev = "b3acae6b7782ea236d0fb87a0121fd1ba2e14c2b" }
gridcraft-model = { git = "https://github.com/storytold/gridcraft", rev = "b3acae6b7782ea236d0fb87a0121fd1ba2e14c2b" }
gridcraft-numfmt = { git = "https://github.com/storytold/gridcraft", rev = "b3acae6b7782ea236d0fb87a0121fd1ba2e14c2b" }
gridcraft-xlsx = { git = "https://github.com/storytold/gridcraft", rev = "b3acae6b7782ea236d0fb87a0121fd1ba2e14c2b" }
# A Parquet file's columns and first rows for the file's pane: Apache's
# own reader, by rows, without Arrow. The codecs are the ones files are
# written with; all but zstd are Rust.
parquet = { version = "60", default-features = false, features = ["snap", "flate2", "flate2-rust_backened", "lz4", "zstd", "brotli"] }

# Probing a pid (the inbox registry) is a Unix signal; a file's identity on
# Windows needs the NTFS file index, which std does not expose on stable.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
winapi-util = "0.1"

# Dictation (`dictate.rs`): transcribe.cpp (MIT, ggml's runtime, Metal
# on Apple silicon) runs every model offered, Qwen3-ASR and Whisper
# alike; and the microphone. A Mac's alone for now: transcribe.cpp
# is built by CMake, which the Windows type check from a Mac cannot run.
[target.'cfg(target_os = "macos")'.dependencies]
transcribe-cpp = "0.4"
cpal = "0.18"
# Named for its include directory alone: build.rs compiles libllama for
# the clean-up (`clean.rs`) against the ggml it installs, so the program
# has one ggml. vendor/llama.cpp/UPSTREAM.md says why the two fit.
transcribe-cpp-sys = "0.4"

[build-dependencies]
cc = "1"

[dev-dependencies]
tempfile = "3"
