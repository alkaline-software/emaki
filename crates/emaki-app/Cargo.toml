[package]
name = "emaki-app"
version.workspace = true
edition.workspace = true
license.workspace = true

# The binary name is what macOS shows in the menu bar and the Dock for a bare binary.
[[bin]]
name = "Emaki"
path = "src/main.rs"

[dependencies]
emaki-core = { path = "../emaki-core" }
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
# The zed revision is pinned in Cargo.lock (cargo update -p gpui --precise <rev>).
# gpui-component depends on the unpinned zed source, so a `rev` here would
# produce a second copy of gpui that it does not build against.
gpui = { git = "https://github.com/zed-industries/zed" }
gpui_platform = { git = "https://github.com/zed-industries/zed", features = ["font-kit", "x11", "wayland", "runtime_shaders"] }
gpui-component = { git = "https://github.com/longbridge/gpui-component", rev = "fd3bc2bbb8a2c4dfe268c1475682476ada54cd0c" }
futures = "0.3"
gpui-component-assets = { git = "https://github.com/longbridge/gpui-component", rev = "fd3bc2bbb8a2c4dfe268c1475682476ada54cd0c" }
# The window selection layer, for ending a drag a swallowed click would leave open.
gpui-base = { git = "https://github.com/longbridge/gpui-component", rev = "fd3bc2bbb8a2c4dfe268c1475682476ada54cd0c" }
uuid = { version = "1", features = ["v4"] }
# The parser behind the toolkit's text view, at the same version, so a
# text can be tried before the view gets it (see `md_view`).
markdown = "1.0.0"
# Open-with and the person's name, without shelling out to macOS commands.
opener = "0.7"
trash = "5"
rust-embed = { version = "8", features = ["debug-embed"] }
whoami = "1"
# The person's picture, cut square and scaled down once to the sizes it
# is drawn at. gpui already builds this crate; the features are the
# formats the file picker takes.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "tiff"] }

# The .exe carries the icon as a resource; nothing to do elsewhere.
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSView", "NSWindow", "NSResponder", "NSApplication", "NSImage", "NSRunningApplication", "NSWorkspace", "NSSpellChecker"] }
objc2-foundation = { version = "0.3", features = ["NSData", "NSString", "NSURL", "NSArray", "NSRange"] }
raw-window-handle = "0.6"

# Installers: `cargo packager --release` (cargo-packager) builds the app and
# wraps it per platform. release.yml passes `--formats` per OS and renames
# the results to the stable names the docs link to. No signing identity is
# set here: the macOS bundle is signed afterwards by scripts/release-mac.sh,
# and Windows is unsigned, which the docs' SmartScreen steps cover.
[package.metadata.packager]
productName = "Emaki"
identifier = "com.pingfanhu.emaki"
description = "Every coding-agent session on this machine, kept for good, in one window you can also talk to."
homepage = "https://github.com/alkaline-software/emaki"
licenseFile = "../../LICENSE"
category = "DeveloperTool"
icons = ["assets/icon/icon.icns", "assets/icon/icon.ico", "assets/icon/icon-*.png"]
outDir = "../../dist"
binaries = [{ path = "Emaki", main = true }]

[package.metadata.packager.macos]
minimumSystemVersion = "14.0"

[package.metadata.packager.nsis]
installMode = "currentUser"

[package.metadata.packager.deb]
depends = ["libxkbcommon0", "libxkbcommon-x11-0", "libwayland-client0", "libvulkan1", "libfontconfig1", "libfreetype6", "libx11-xcb1", "libxcb1"]
